[workspace]
members = [
    "crates/faqe-cli",
    "crates/faqe-content",
    "crates/faqe-model",
    "crates/faqe-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "One-binary Markdown-to-WASM personal website generator"
license = "MIT"
readme = "README.md"
publish = false

[workspace.dependencies]
ammonia = "4.1.4"
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
gloo-events = "0.2"
gloo-timers = "0.3"
gloo-utils = "0.2"
html5ever = "0.39"
include_dir = "0.7"
js-sys = "0.3"
libc = "0.2"
pulldown-cmark = "0.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
tree-sitter-bash = "0.25.1"
tree-sitter-highlight = "0.26.11"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
unicode-normalization = "0.1"
# Keep the library schema aligned with the wasm-bindgen CLI provided by flake.nix.
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "0.4"
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"

[workspace.dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "DomTokenList",
    "Element",
    "EventTarget",
    "History",
    "HtmlAnchorElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Node",
    "NodeList",
    "PopStateEvent",
    "Response",
    "Window",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
